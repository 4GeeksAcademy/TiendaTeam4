<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo | LUXE</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-900 font-sans antialiased">
  <header class="bg-white border-b border-stone-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-14">
      <a href="index.html" class="text-2xl font-bold text-stone-900" aria-label="LUXE, página de inicio">LUXE<span class="text-stone-400">.</span></a>
      <nav class="flex items-center gap-4 sm:gap-6 text-sm font-medium text-stone-600" aria-label="Navegación principal">
        <a href="catalog.html" class="text-stone-900 font-semibold" aria-current="page">Catálogo</a>
        <a href="cart.html" class="hover:text-stone-900 transition-colors">Carrito</a>
      </nav>
    </div>
  </header>
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 sm:py-14">
    <header class="mb-8 sm:mb-10">
      <p class="text-xs font-semibold uppercase tracking-wide text-stone-500">LUXE · Colección</p>
      <h1 class="mt-2 text-3xl sm:text-4xl font-bold text-stone-900">Catálogo</h1>
      <p class="mt-3 max-w-2xl text-sm sm:text-base text-stone-600">Descubre prendas y accesorios para cada ocasión.</p>
    </header>
    <nav class="flex flex-wrap gap-x-6 gap-y-3 border-y border-stone-200 py-5 text-sm" aria-label="Categorías del catálogo">
      <a href="catalog-woman.html" class="text-stone-600 hover:text-stone-900">Mujer</a>
      <a href="catalog-man.html" class="text-stone-600 hover:text-stone-900">Hombre</a>
      <a href="catalog-accessories.html" class="text-stone-600 hover:text-stone-900">Accesorios</a>
    </nav>
    <section class="mt-8 grid grid-cols-1 sm:grid-cols-3 gap-4 sm:gap-6" aria-label="Colecciones">
      <a href="catalog-woman.html" class="group block bg-white rounded-lg overflow-hidden border border-stone-100 hover:border-stone-200 transition">
        <div class="aspect-[4/3] sm:aspect-[3/4] bg-stone-100 overflow-hidden">
          <img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&amp;fit=crop&amp;w=900&amp;q=80" alt="Modelo con ropa contemporánea para mujer" class="h-full w-full object-cover group-hover:scale-105 transition-transform duration-300" width="900" height="1200" />
        </div>
        <div class="p-4 sm:p-5">
          <h2 class="font-semibold text-stone-900 text-xl">Mujer</h2>
          <p class="mt-1 text-sm text-stone-500">9 productos</p>
        </div>
      </a>
      <a href="catalog-man.html" class="group block bg-white rounded-lg overflow-hidden border border-stone-100 hover:border-stone-200 transition">
        <div class="aspect-[4/3] sm:aspect-[3/4] bg-stone-100 overflow-hidden">
          <img src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?auto=format&amp;fit=crop&amp;w=900&amp;q=80" alt="Modelo con prendas de moda masculina" class="h-full w-full object-cover group-hover:scale-105 transition-transform duration-300" width="900" height="1200" />
        </div>
        <div class="p-4 sm:p-5">
          <h2 class="font-semibold text-stone-900 text-xl">Hombre</h2>
          <p class="mt-1 text-sm text-stone-500">7 productos</p>
        </div>
      </a>
      <a href="catalog-accessories.html" class="group block bg-white rounded-lg overflow-hidden border border-stone-100 hover:border-stone-200 transition">
        <div class="aspect-[4/3] sm:aspect-[3/4] bg-stone-100 overflow-hidden">
          <img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&amp;fit=crop&amp;w=900&amp;q=80" alt="Mochila y accesorios para uso diario" class="h-full w-full object-cover group-hover:scale-105 transition-transform duration-300" width="900" height="1200" />
        </div>
        <div class="p-4 sm:p-5">
          <h2 class="font-semibold text-stone-900 text-xl">Accesorios</h2>
          <p class="mt-1 text-sm text-stone-500">4 productos</p>
        </div>
      </a>
    </section>
  </main>
  <footer class="bg-stone-100 border-t border-stone-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col sm:flex-row sm:items-center justify-between gap-5">
      <p class="text-sm text-stone-500">© 2026 LUXE. Todos los derechos reservados.</p>
      <nav class="flex flex-wrap gap-5 text-sm text-stone-600" aria-label="Categorías al pie">
        <a href="catalog-woman.html" class="hover:text-stone-900">Mujer</a>
        <a href="catalog-man.html" class="hover:text-stone-900">Hombre</a>
        <a href="catalog-accessories.html" class="hover:text-stone-900">Accesorios</a>
      </nav>
    </div>
  </footer>
</body>
</html>
